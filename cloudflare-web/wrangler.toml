name = "erp-system"
main = "src/index.js"
compatibility_date = "2026-09-05"

# The Vite build remains a static SPA. The Worker runs first so it can own the
# API gateway and select marketplace.html for shop.atlaserp.dev.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
MARKETPLACE_HOST = "shop.atlaserp.dev"

# Keep this list in sync with the production Worker configuration. Values are
# intentionally not stored here: they must be added as Cloudflare secrets.
[secrets]
required = [
  "SUPABASE_URL",
  "SUPABASE_ANON_KEY",
  "SUPABASE_SERVICE_ROLE_KEY",
  "R2_WORKER_URL"
]
